<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahmoud & Yara - Wedding Invitation</title>
<meta name="theme-color" content="#1f0a10">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#6e1423;--wine2:#4d0e19;--cream:#f7f1e3;--gold:#d4af6a;--ink:#1f0a10}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Cormorant Garamond",serif;background:var(--ink);color:var(--cream);overflow:hidden}

/* ---------- Envelope intro ---------- */
#intro{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;cursor:pointer;transition:opacity .9s ease .6s,visibility 0s 1.5s}
#intro.open{opacity:0;visibility:hidden}
.env{position:relative;width:min(82vw,460px);aspect-ratio:1.6;background:var(--wine);box-shadow:0 14px 30px rgba(77,14,25,.4);transition:transform .8s ease;outline:1px solid rgba(212,175,106,.5);outline-offset:-10px}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.5%,rgba(0,0,0,.22) 50%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49.5%,rgba(0,0,0,.22) 50%) right/50% 100% no-repeat;opacity:.5}
.flap{position:absolute;top:0;left:0;width:100%;height:58%;background:var(--wine2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:2;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.seal{position:absolute;left:50%;top:58%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d99b,#b88f3f);display:grid;place-items:center;z-index:3;font-family:"Pinyon Script",cursive;font-size:clamp(14px,3.4vw,24px);color:#5c4318;box-shadow:0 3px 8px rgba(0,0,0,.4);transition:opacity .3s}
#intro.open .flap{transform:rotateX(180deg);z-index:0}
#intro.open .seal{opacity:0}
#intro.open .env{transform:translateY(40px) scale(.92)}
.tap{letter-spacing:.12em;color:#9a7a35;font-size:1.1rem}

/* ---------- Background + sections ---------- */
#bg{position:fixed;inset:-30px;background:var(--ink) center/cover no-repeat;filter:blur(14px) brightness(.6) saturate(.9);z-index:0}
#bg::after{content:"";position:absolute;inset:0;background:rgba(60,10,22,.5)}
#bg.has-img{background-image:var(--photo)}
#bg:not(.has-img){background-image:radial-gradient(circle at 30% 20%,#7a1b2e,#1f0a10 70%)}
.frame{position:fixed;inset:8px;border:1px solid rgba(212,175,106,.45);z-index:5;pointer-events:none}
main{position:relative;z-index:2;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
section{height:100vh;height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;position:relative}
.arrow{position:absolute;bottom:22px;width:22px;height:22px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg) scale(.6);opacity:.8;animation:bob 2s infinite}
@keyframes bob{50%{transform:rotate(45deg) scale(.6) translate(4px,4px)}}
h2{font-weight:500;font-size:clamp(1.8rem,5vw,2.4rem)}
.script{font-family:"Pinyon Script",cursive;font-weight:400}
.divider{display:flex;align-items:center;gap:10px;color:var(--gold)}
.divider::before,.divider::after{content:"";width:60px;height:1px;background:var(--gold)}
.divider i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.gold{color:var(--gold);letter-spacing:.08em}

/* Hero */
.monogram{width:92px;aspect-ratio:1;border-radius:50%;border:1px solid var(--gold);outline:1px solid rgba(212,175,106,.4);outline-offset:5px;background:rgba(110,20,35,.7);color:var(--gold);display:grid;place-items:center;font-family:"Pinyon Script",cursive;font-size:2.3rem}
.en-names{font-size:clamp(2.8rem,10vw,4.8rem);line-height:1.1}
.verse{font-family:"Amiri",serif;font-size:1.2rem;line-height:2;opacity:.95;max-width:520px}
.ref{font-size:.9rem;opacity:.75;margin-top:-8px}

/* Calendar */
.cal{border:1px solid rgba(212,175,106,.55);background:rgba(255,255,255,.07);padding:14px 16px;display:grid;grid-template-columns:repeat(7,36px);gap:4px 2px;font-size:1.05rem}
.cal b{color:var(--gold);font-size:.78rem;font-weight:500;padding-bottom:6px}
.cal span{height:32px;display:grid;place-items:center}
.cal .on{background:var(--gold);color:var(--ink);border-radius:50%;font-weight:600;box-shadow:0 0 0 4px rgba(212,175,106,.3)}

/* Countdown */
.count{display:flex;gap:10px}
.count div{width:64px;padding:10px 0 8px;border:1px solid rgba(212,175,106,.6);background:rgba(255,255,255,.08)}
.count strong{display:block;font-size:1.9rem;font-weight:500;line-height:1.1}
.count small{font-size:.72rem;opacity:.85}

/* Venue */
.pin{width:26px;height:26px;color:var(--gold)}
.btn{margin-top:8px;padding:10px 22px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;letter-spacing:.06em;transition:background .2s,color .2s}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--ink);outline:none}

/* Thank you */
.thanks{font-size:clamp(3.4rem,13vw,5.4rem);line-height:1}

#music{position:fixed;top:16px;right:16px;z-index:60;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:rgba(31,10,16,.85);color:var(--gold);font-size:1.1rem;cursor:pointer;display:none}
#music.show{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div id="intro" role="button" tabindex="0" aria-label="Open invitation">
  <div class="env"><div class="flap"></div><div class="seal" id="sealText"></div></div>
  <div class="tap">Tap to open</div>
</div>

<div id="bg"></div>
<div class="frame"></div>
<button id="music" aria-label="Play or pause recitation">♪</button>
<audio id="audio" preload="none"></audio>

<main>
  <section>
    <div class="monogram" id="mono"></div>
    <div class="gold" style="font-size:.95rem">Wedding Invitation</div>
    <div class="en-names script" id="enNames"></div>
    <p class="verse" id="verse"></p>
    <div class="ref" id="ref"></div>
    <div class="gold" id="dateLine"></div>
    <i class="arrow"></i>
  </section>

  <section>
    <h2 class="script" style="font-size:clamp(2.6rem,8vw,3.6rem)">Date</h2>
    <div class="divider"><i></i></div>
    <div class="gold" id="monthLabel"></div>
    <div class="cal" id="cal"></div>
    <i class="arrow"></i>
  </section>

  <section>
    <h2>Counting Down</h2>
    <div class="divider"><i></i></div>
    <div class="count" id="count"></div>
    <i class="arrow"></i>
  </section>

  <section>
    <h2>The Venue</h2>
    <div class="divider"><i></i></div>
    <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    <div style="font-size:1.5rem" id="venue"></div>
    <div class="gold" id="venueDate"></div>
    <a class="btn" id="mapBtn" target="_blank" rel="noopener">Open in Maps</a>
    <i class="arrow"></i>
  </section>

  <section>
    <div class="thanks script">Thank You</div>
    <div class="divider"><i></i></div>
    <div class="script" id="enNames2" style="font-size:clamp(2.2rem,8vw,3.4rem)"></div>
  </section>
</main>

<script>
/* ========= EDIT YOUR DETAILS HERE ========= */
const CONFIG = {
  nameEn: "Mahmoud & Yara",
  initials: "M&Y",
  verse: "وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا<br>لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً",
  verseRef: "سورة الروم - الآية ٢١",
  date: "2026-11-24T20:00:00",       // <-- keep YOUR current time here
  venue: 'Elmasa "Elrahman Elraheem"',
  mapUrl: "https://maps.google.com/?q=Venue+Name",
   // <-- keep YOUR current map link here
  photo: "photo.jpg",                 // background photo ("" for none)
  audio: "quran.mp3"                  // recitation file ("" for none)
};
/* =========================================== */

const $ = id => document.getElementById(id);
const d = new Date(CONFIG.date);
const longDate = d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

$("sealText").textContent = CONFIG.initials;
$("mono").textContent = CONFIG.initials;
$("enNames").textContent = CONFIG.nameEn;
$("enNames2").textContent = CONFIG.nameEn;
$("verse").innerHTML = CONFIG.verse;
$("ref").textContent = CONFIG.verseRef;
$("dateLine").textContent = longDate;
$("venue").textContent = CONFIG.venue;
$("venueDate").textContent = longDate;
$("mapBtn").href = CONFIG.mapUrl;
$("monthLabel").textContent = d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});

if (CONFIG.photo) {
  const img = new Image();
  img.onload = () => {
    $("bg").style.setProperty("--photo",`url("${CONFIG.photo}")`);
    $("bg").classList.add("has-img");
  };
  img.src = CONFIG.photo;
}

/* Calendar (week starts Saturday) */
(function(){
  const days = ["Sa","Su","Mo","Tu","We","Th","Fr"];
  let html = days.map(x=>`<b>${x}</b>`).join("");
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const offset = (first.getDay() + 1) % 7;
  const total = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  html += "<span></span>".repeat(offset);
  for (let i=1;i<=total;i++) html += `<span${i===d.getDate()?' class="on"':''}>${i}</span>`;
  $("cal").innerHTML = html;
})();

/* Countdown */
function tick(){
  let s = Math.max(0, Math.floor((d - new Date())/1000));
  const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60];
  const l = ["Days","Hours","Minutes","Seconds"];
  $("count").innerHTML = v.map((n,i)=>`<div><strong>${String(n).padStart(2,"0")}</strong><small>${l[i]}</small></div>`).join("");
}
tick(); setInterval(tick, 1000);

/* Open envelope + recitation (plays once, no loop) */
const audio = $("audio"), music = $("music");
function openInvite(){
  $("intro").classList.add("open");
  if (CONFIG.audio) {
    audio.src = CONFIG.audio;
    music.classList.add("show");
    audio.play().catch(()=>{});
  }
}
$("intro").addEventListener("click", openInvite);
$("intro").addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") openInvite(); });
music.addEventListener("click", () => audio.paused ? audio.play() : audio.pause());
</script>
</body>
</html>
